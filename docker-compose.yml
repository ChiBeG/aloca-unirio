services:
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only-troque-em-producao}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3002}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SQLITE_PATH: /app/data/db.sqlite3
    volumes:
      - ./backend/entrada:/app/entrada:ro
      - backend-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      DJANGO_BASE_URL: http://backend:8000
      DJANGO_PUBLIC_URL: ${DJANGO_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "3002:3002"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
